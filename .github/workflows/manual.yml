name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the Android SDK preinstalled on the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager || ls "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest/bin" 2>/dev/null || true

      - name: Install SDK packages and accept licences
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v5
        with:
          name: bucket-list-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
